name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  pull-requests: write

# scripts/build.ts gives its tsc and tsup children their own declaration heap
# (DECLARATION_HEAP_MB); this workflow-wide ceiling covers the remaining steps
# and must not fall below it (see tests/ci-workflow-contract.test.ts).
env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  release:
    name: Changesets
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: latchkey-large
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Restore pnpm cache (Latchkey)
        uses: latchkey-dev/cache-action@v1
        id: latchkey-cache-pnpm
        with:
          action: restore
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          path: ~/.local/share/pnpm/store
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Save pnpm cache (Latchkey)
        uses: latchkey-dev/cache-action@v1
        if: steps.latchkey-cache-pnpm.outputs.cache-hit != 'true'
        with:
          action: save
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          path: ~/.local/share/pnpm/store
      - name: Smoke test npm tarball
        run: |
          pnpm --filter @nicia-ai/typegraph build
          bash packages/typegraph/scripts/smoke-packed-tarball.sh .tmp-release

      - name: Create release PR or publish
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: pnpm release
          create-github-releases: true
        env:
          # Provenance currently requires a public source repository.
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private != true }}
